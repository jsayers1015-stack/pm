<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Backend running</title>
    <style>
      :root {
        --accent-yellow: #ecad0a;
        --primary-blue: #209dd7;
        --navy-dark: #032147;
        --gray-text: #767676;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f7f8fb;
        color: var(--navy-dark);
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      main {
        background: #fff;
        border-radius: 24px;
        padding: 48px;
        max-width: 520px;
        box-shadow: 0 18px 40px rgba(3, 33, 71, 0.12);
      }
      .rule {
        height: 4px;
        width: 64px;
        background: var(--accent-yellow);
        border-radius: 999px;
      }
      h1 {
        margin: 24px 0 8px;
        font-size: 28px;
      }
      p {
        color: var(--gray-text);
        line-height: 1.6;
      }
      a {
        color: var(--primary-blue);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="rule"></div>
      <h1>Backend running</h1>
      <p>
        This placeholder only appears in local dev mode. The container serves the
        NextJS static export here instead. For the UI with hot reload, open
        <a href="http://localhost:3000">localhost:3000</a>.
      </p>
    </main>
  </body>
</html>
