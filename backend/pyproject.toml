[project]
name = "pm-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "itsdangerous>=2.2.0",
    "httpx2>=2.12.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
# Live tests call the real OpenRouter API, so they are opt-in via -m live.
addopts = "-m 'not live'"
markers = ["live: hits the live OpenRouter API and needs OPENROUTER_API_KEY"]
